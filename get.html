<meta property="og:url" content="https://gunesserenay.github.io/stillgrid-site/get.html">
<script>
  // The link the app shares opens this page (decision 2026-11-12). Once both
  // store pages are live it sends an iPhone or iPad to the App Store and an
  // Android phone to Google Play; a computer sees the page. It is off before
  // launch, when the store links still open "not found": to turn it on, set
  // REDIRECT to true. Add ?stay to the address to see the page on a phone.
  // Only this page redirects: index, support, privacy and terms never do,
  // because the stores link them and their reviewers must be able to open them.
  (function () {
    var REDIRECT = true;
    if (!REDIRECT || /[?&]stay\b/.test(location.search)) return;
    var ua = navigator.userAgent || '';
    // iPadOS asks for desktop pages and calls itself a Mac with a touch screen.
    var ios = /iPhone|iPad|iPod/.test(ua) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var android = /Android/.test(ua);
    var store = ios ? 'https://apps.apple.com/app/id6822759221'
      : android ? 'https://play.google.com/store/apps/details?id=com.moonsunapp.stillgrid'
      : null;
    if (store) location.replace(store);
  })();
</script>
<style>
  :root { --ink: #22304A; --paper: #F5F2EA; --card: #FFFDF8; --line: #D9D3C4; --pencil: #6E6A5E; --highlight: #F2C94C; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #E9E4D8; --paper: #171C26; --card: #1F2633; --line: #3A4253; --pencil: #A39E91; --highlight: #E8BE45; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 64px 16px; text-align: center; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: 2.4rem; margin: 0 0 8px; }
  .mark { background: linear-gradient(transparent 55%, var(--highlight) 55%); padding: 0 2px; }
  p { color: var(--pencil); margin: 0 0 32px; }
  a.button {
    display: inline-block; padding: 10px 20px; border: 1.5px solid var(--ink); border-radius: 6px;
    background: var(--card); color: var(--ink); text-decoration: none;
  }
  a.button:hover, a.button:focus { background: var(--highlight); color: #22304A; }
  .stores { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  nav.links { display: flex; flex-direction: column; gap: 8px; font-size: 0.95rem; }
  nav.links a { color: var(--ink); }
</style>

  </p>
