<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stillgrid</title>
<meta name="description" content="Stillgrid: Nonogram Puzzles, a calm nonogram game for iOS and Android.">
<style>
  :root { --ink: #22304A; --paper: #F5F2EA; --card: #FFFDF8; --line: #D9D3C4; --pencil: #6E6A5E; --highlight: #F2C94C; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #E9E4D8; --paper: #171C26; --card: #1F2633; --line: #3A4253; --pencil: #A39E91; --highlight: #E8BE45; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 64px 16px; text-align: center; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: 2.4rem; margin: 0 0 8px; }
  .mark { background: linear-gradient(transparent 55%, var(--highlight) 55%); padding: 0 2px; }
  p { color: var(--pencil); margin: 0 0 32px; }
  a.button {
    display: inline-block; padding: 10px 20px; border: 1.5px solid var(--ink); border-radius: 6px;
    background: var(--card); color: var(--ink); text-decoration: none;
  }
  a.button:hover, a.button:focus { background: var(--highlight); color: #22304A; }
</style>
</head>
<body>
<main>
  <h1><span class="mark">Stillgrid</span></h1>
  <p>A calm nonogram puzzle game for iOS and Android.<br>Sakin bir nonogram bulmaca oyunu.</p>
  <a class="button" href="privacy.html">Privacy Policy · Gizlilik Politikası</a>
</main>
</body>
</html>
